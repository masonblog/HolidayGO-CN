name: Build and Deploy

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      configure_redirect_only:
        description: "Only configure and verify the Cloudflare legacy domain redirect"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "deploy-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  configure-redirect:
    if: github.event_name == 'workflow_dispatch' && inputs.configure_redirect_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configure and verify the legacy domain redirect
        run: node scripts/configure-cloudflare-redirect.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  checks:
    if: github.event_name != 'workflow_dispatch' || !inputs.configure_redirect_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run validate-data
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  deploy-cloudflare:
    needs: checks
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: cloudflare-workers
      url: https://holiday.masonhu.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Deploy to Cloudflare Workers incrementally
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-github:
    needs: checks
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          GITHUB_PAGES: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: Deploy fallback to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
