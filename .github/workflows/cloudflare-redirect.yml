name: Configure Cloudflare legacy redirect

on:
  push:
    branches: [codex/cloudflare-redirect-migration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-legacy-redirect
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configure and verify the legacy domain redirect
        run: node scripts/configure-cloudflare-redirect.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
